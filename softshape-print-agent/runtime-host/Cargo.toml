[package]
name = "softshape-host"
version = "23.10.0"
edition = "2021"
rust-version = "1.70"

[lib]
name = "softshape_host"
path = "src/lib.rs"

[[bin]]
name = "softshape-host"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
