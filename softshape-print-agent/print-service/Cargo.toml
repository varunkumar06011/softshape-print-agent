[package]
name = "softshape-print-service"
version = "23.11.1"
edition = "2021"
rust-version = "1.70"

[[bin]]
name = "print-service"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = [
    "Win32_Graphics_Printing",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_Security",
] }
