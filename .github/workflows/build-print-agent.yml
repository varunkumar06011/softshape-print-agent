name: Build Print Agent

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  NODE_VERSION: 22
  RUST_VERSION: 1.88
  CERTIFICATE_THUMBPRINT: ${{ secrets.CERTIFICATE_THUMBPRINT }}
  # Backend URL baked into the bundle at build time. The agent throws on
  # startup if this is missing (see src/agentSocket.js). The print agent is a
  # standalone app and connects to its own backend, NOT softshape.in.
  VITE_BACKEND_URL: https://api.softshape.in

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ── @softshape/output dependency ──────────────────────────────────────
      # The edge-server depends on @softshape/output (file:../../../packages/output)
      # which lives in the SoftshapeAI repo. We sparse-checkout just that package,
      # build its dist/, and place it at the relative path the edge-server expects.
      # This cross-repo workaround is temporary — replace with a published package
      # or monorepo workspace when the dependency model is cleaned up.
      - name: Checkout @softshape/output dependency
        uses: actions/checkout@v4
        with:
          repository: varunkumar06011/Softshapeai
          path: temp-softshapeai
          sparse-checkout: |
            packages/output

      - name: Build and place @softshape/output
        shell: bash
        run: |
          cd temp-softshapeai/packages/output
          npm install
          npm run build
          # Verify dist was produced
          if [ ! -f dist/index.js ]; then
            echo "::error::@softshape/output dist/index.js not produced by tsc"
            exit 1
          fi

          # Place @softshape/output inside the workspace at a known path.
          # We rewrite edge-server/package.json to point to this in-workspace path
          # instead of the default file:../../../packages/output (which resolves
          # outside the workspace and may be rejected by bun's path-escape guard).
          # Exclude node_modules — bun will resolve deps from edge-server's install.
          mkdir -p "$GITHUB_WORKSPACE/.deps/packages/output"
          cp -r src dist package.json tsconfig.json "$GITHUB_WORKSPACE/.deps/packages/output/"
          echo "Placed @softshape/output at $GITHUB_WORKSPACE/.deps/packages/output"
          ls -la "$GITHUB_WORKSPACE/.deps/packages/output/dist/index.js"

      # Rewrite edge-server's @softshape/output dependency to point to the
      # in-workspace copy. The original path (file:../../../packages/output)
      # resolves outside $GITHUB_WORKSPACE which bun may refuse to install.
      - name: Rewrite edge-server dependency path
        shell: bash
        run: |
          cd softshape-print-agent/edge-server
          # edge-server is at $GITHUB_WORKSPACE/softshape-print-agent/edge-server/
          # @softshape/output is at $GITHUB_WORKSPACE/.deps/packages/output/
          # Relative path from edge-server to .deps: ../../.deps/packages/output
          sed -i 's|"file:../../../packages/output"|"file:../../.deps/packages/output"|' package.json
          echo "Rewritten edge-server/package.json dependency:"
          grep -A1 "softshape/output" package.json

      # ── Build edge-server.exe (Bun compile) ──────────────────────────────
      - name: Build edge-server
        working-directory: softshape-print-agent/edge-server
        shell: bash
        run: |
          # Remove lockfiles — they reference the old @softshape/output path
          # which we rewrote in the previous step. Fresh resolution is required.
          rm -f bun.lock package-lock.json
          bun install
          bun build --compile server.ts --outfile edge-server.exe

      - name: Verify edge-server.exe
        working-directory: softshape-print-agent/edge-server
        shell: bash
        run: |
          if [ ! -f edge-server.exe ]; then
            echo "::error::edge-server.exe was not produced by bun build --compile"
            ls -la
            exit 1
          fi
          ls -la edge-server.exe

      # ── Build print-service.exe (Rust) ───────────────────────────────────
      - name: Build print-service
        working-directory: softshape-print-agent/print-service
        shell: bash
        run: cargo build --release

      - name: Verify print-service.exe
        working-directory: softshape-print-agent/print-service
        shell: bash
        run: |
          if [ ! -f target/release/print-service.exe ]; then
            echo "::error::print-service.exe was not produced by cargo build"
            ls -la target/release/
            exit 1
          fi
          ls -la target/release/print-service.exe

      # ── Build softshape-host.exe (Rust) ──────────────────────────────────
      - name: Build runtime-host
        working-directory: softshape-print-agent/runtime-host
        shell: bash
        run: cargo build --release

      - name: Verify softshape-host.exe
        working-directory: softshape-print-agent/runtime-host
        shell: bash
        run: |
          if [ ! -f target/release/softshape-host.exe ]; then
            echo "::error::softshape-host.exe was not produced by cargo build"
            ls -la target/release/
            exit 1
          fi
          ls -la target/release/softshape-host.exe

      # ── Sign all three runtime binaries (if cert available) ──────────────
      - name: Sign runtime binaries
        if: env.CERTIFICATE_THUMBPRINT != ''
        shell: powershell
        run: |
          $binaries = @(
            "softshape-print-agent/edge-server/edge-server.exe",
            "softshape-print-agent/print-service/target/release/print-service.exe",
            "softshape-print-agent/runtime-host/target/release/softshape-host.exe"
          )
          foreach ($exe in $binaries) {
            if (Test-Path $exe) {
              Write-Host "Signing $exe"
              signtool sign /sha1 "$env:CERTIFICATE_THUMBPRINT" /tr http://timestamp.digicert.com /td sha256 /fd sha256 "$exe"
            }
          }
        env:
          CERTIFICATE_THUMBPRINT: ${{ secrets.CERTIFICATE_THUMBPRINT }}

      # ── Copy runtime binaries into src-tauri/ for Tauri resource bundling ─
      - name: Copy runtime binaries to src-tauri
        shell: bash
        run: |
          cp softshape-print-agent/edge-server/edge-server.exe src-tauri/edge-server.exe
          cp softshape-print-agent/print-service/target/release/print-service.exe src-tauri/print-service.exe
          cp softshape-print-agent/runtime-host/target/release/softshape-host.exe src-tauri/softshape-host.exe
          echo "Runtime binaries in src-tauri/:"
          ls -la src-tauri/edge-server.exe src-tauri/print-service.exe src-tauri/softshape-host.exe

      - name: Generate Tauri icons
        shell: bash
        run: npx tauri icon app-icon.png

      - name: Build Print Agent
        run: npx tauri build
        env:
          VITE_BACKEND_URL: ${{ env.VITE_BACKEND_URL }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      # ── Verify all three binaries are bundled in the build output ────────
      - name: Verify runtime binaries bundled in build output
        shell: bash
        run: |
          missing=0
          for name in edge-server.exe print-service.exe softshape-host.exe; do
            found=""
            for candidate in \
              "src-tauri/target/release/$name" \
              "src-tauri/target/release/resources/$name"; do
              if [ -f "$candidate" ]; then found="$candidate"; break; fi
            done
            if [ -z "$found" ]; then
              echo "::error::$name not found in Tauri build output"
              missing=1
            else
              echo "Found $name at: $found"
              ls -la "$found"
            fi
          done
          if [ $missing -ne 0 ]; then
            find src-tauri/target/release -name 'edge-server.exe' -o -name 'print-service.exe' -o -name 'softshape-host.exe' 2>/dev/null || true
            exit 1
          fi

      # ── Smoke test: silent install, verify :3101, :3103, printer enum ────
      - name: Smoke-test installed runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" |
            Where-Object { $_.Name -notmatch 'uninstall' } | Select-Object -First 1
          if (-not $installer) {
            Write-Error "NSIS installer not found"
            exit 1
          }
          Write-Host "Installer: $($installer.FullName)"

          $installDir = Join-Path $env:RUNNER_TEMP "softshape-print-agent-smoke"
          if (Test-Path $installDir) { Remove-Item -Recurse -Force $installDir }
          New-Item -ItemType Directory -Path $installDir | Out-Null

          Write-Host "Silent-installing to $installDir"
          $proc = Start-Process -FilePath $installer.FullName -ArgumentList "/S","/D=$installDir" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Error "NSIS silent install failed with exit code $($proc.ExitCode)"
            exit 1
          }

          # Verify all three runtime binaries exist in the install directory
          $hostExe = Join-Path $installDir "softshape-host.exe"
          $edgeExe = Join-Path $installDir "edge-server.exe"
          $printExe = Join-Path $installDir "print-service.exe"
          foreach ($exe in @($hostExe, $edgeExe, $printExe)) {
            if (-not (Test-Path $exe)) {
              Write-Host "Install tree:"
              Get-ChildItem -Path $installDir -Recurse | Select-Object FullName
              Write-Error "Missing: $exe"
              exit 1
            }
          }
          Write-Host "All three runtime binaries present in install directory"

          # Launch softshape-host.exe with --no-autostart (CI: don't register autostart)
          # The host spawns edge-server.exe, which spawns print-service.exe.
          $hostProc = Start-Process -FilePath $hostExe -ArgumentList "--no-autostart" `
            -PassThru -WindowStyle Hidden -WorkingDirectory $installDir

          # Wait for edge-server :3101 health (host spawns edge, edge inits DB)
          $edgeHealthy = $false
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline) {
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:3101/health" -UseBasicParsing -TimeoutSec 3
              if ($resp.StatusCode -eq 200) {
                Write-Host "Edge server health OK: $($resp.Content)"
                $edgeHealthy = $true
                break
              }
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $edgeHealthy) {
            Stop-Process -Id $hostProc.Id -Force -ErrorAction SilentlyContinue
            Write-Error "edge-server never responded on :3101/health within 60s"
            exit 1
          }

          # Wait for print-service :3103 health (edge spawns print-service)
          $printHealthy = $false
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline) {
            try {
              $resp = Invoke-WebRequest -Uri "http://127.0.0.1:3103/health" -UseBasicParsing -TimeoutSec 3
              if ($resp.StatusCode -eq 200) {
                Write-Host "Print service health OK: $($resp.Content)"
                $printHealthy = $true
                break
              }
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $printHealthy) {
            Stop-Process -Id $hostProc.Id -Force -ErrorAction SilentlyContinue
            Write-Error "print-service never responded on :3103/health within 30s"
            exit 1
          }

          # Verify printer enumeration via :3103/printers
          try {
            $resp = Invoke-WebRequest -Uri "http://127.0.0.1:3103/printers" -UseBasicParsing -TimeoutSec 5
            if ($resp.StatusCode -eq 200) {
              Write-Host "Printer enumeration OK: $($resp.Content)"
            } else {
              Stop-Process -Id $hostProc.Id -Force -ErrorAction SilentlyContinue
              Write-Error "Printer enumeration failed with status $($resp.StatusCode)"
              exit 1
            }
          } catch {
            Stop-Process -Id $hostProc.Id -Force -ErrorAction SilentlyContinue
            Write-Error "Printer enumeration request failed: $_"
            exit 1
          }

          Write-Host "=== Smoke test PASSED: :3101 healthy, :3103 healthy, printers enumerated ==="

          # Cleanup
          Stop-Process -Id $hostProc.Id -Force -ErrorAction SilentlyContinue
          Get-Process -Name "softshape-host","edge-server","print-service" -ErrorAction SilentlyContinue |
            Stop-Process -Force -ErrorAction SilentlyContinue

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: print-agent-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: warn

      # Produce the two fixed filenames the rest of the system expects:
      #  1. print-agent-windows-x86_64-setup.exe → Tauri auto-updater URL built
      #     by the backend (/api/updates/print-agent/...).
      #  2. SoftShape.Print.Agent_x64-setup.exe → manual "latest" download link
      #     referenced by the admin app (VITE_PRINT_AGENT_DOWNLOAD_URL).
      - name: Rename installer to fixed filenames
        shell: bash
        run: |
          dir="src-tauri/target/release/bundle/nsis"
          updater="print-agent-windows-x86_64-setup.exe"
          manual="SoftShape.Print.Agent_x64-setup.exe"

          echo "Contents of $dir:"
          ls -la "$dir" || true

          # Find the original installer (skip our two target filenames)
          exe=""
          for f in "$dir"/*.exe; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            if [ "$base" != "$updater" ] && [ "$base" != "$manual" ]; then
              exe="$f"
              break
            fi
          done

          if [ -z "$exe" ]; then
            echo "::error::No NSIS installer found in $dir"
            exit 1
          fi
          echo "Found installer: $exe"
          cp "$exe" "$dir/$updater"
          cp "$exe" "$dir/$manual"

          # Find the signature (if any)
          sig=""
          for s in "$dir"/*.sig; do
            [ -e "$s" ] || continue
            base=$(basename "$s")
            if [ "$base" != "${updater}.sig" ] && [ "$base" != "${manual}.sig" ]; then
              sig="$s"
              break
            fi
          done

          if [ -n "$sig" ]; then
            cp "$sig" "$dir/${updater}.sig"
            cp "$sig" "$dir/${manual}.sig"
            echo "── Updater signature (copy into backend env PRINT_AGENT_DESKTOP_APP_SIGNATURE_WINDOWS) ──"
            cat "$sig"
            echo ""
          else
            echo "::warning::No .sig produced — auto-updater will not work without a signature"
          fi

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            src-tauri/target/release/bundle/nsis/print-agent-windows-x86_64-setup.exe
            src-tauri/target/release/bundle/nsis/print-agent-windows-x86_64-setup.exe.sig
            src-tauri/target/release/bundle/nsis/SoftShape.Print.Agent_x64-setup.exe
            src-tauri/target/release/bundle/nsis/SoftShape.Print.Agent_x64-setup.exe.sig
